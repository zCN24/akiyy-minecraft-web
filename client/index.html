<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Minecraft Web 管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-500 via-purple-500 to-pink-500">
    <div class="min-h-screen flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full">
            <!-- Logo/Title -->
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-white mb-2">Minecraft Web</h1>
                <p class="text-blue-100">服务器管理系统</p>
            </div>

            <!-- Card -->
            <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
                <!-- Tabs -->
                <div class="flex border-b">
                    <button id="loginTab" class="flex-1 py-4 text-center font-semibold text-blue-600 border-b-2 border-blue-600 transition">
                        登录
                    </button>
                    <button id="registerTab" class="flex-1 py-4 text-center font-semibold text-gray-500 hover:text-gray-700 transition">
                        注册
                    </button>
                </div>

                <!-- Login Form -->
                <div id="loginForm" class="p-8">
                    <form id="loginFormElement" class="space-y-6">
                        <div>
                            <label class="block text-gray-700 font-medium mb-2">用户名</label>
                            <input type="text" id="loginUsername" required
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                                placeholder="请输入用户名">
                        </div>
                        <div>
                            <label class="block text-gray-700 font-medium mb-2">密码</label>
                            <input type="password" id="loginPassword" required
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                                placeholder="请输入密码">
                        </div>
                        <div id="loginError" class="hidden p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm"></div>
                        <button type="submit"
                            class="w-full bg-gradient-to-r from-blue-500 to-blue-600 text-white py-3 rounded-lg font-semibold hover:from-blue-600 hover:to-blue-700 transform hover:scale-105 transition duration-200 shadow-lg">
                            登录
                        </button>
                    </form>
                </div>

                <!-- Register Form -->
                <div id="registerForm" class="p-8 hidden">
                    <form id="registerFormElement" class="space-y-6">
                        <div>
                            <label class="block text-gray-700 font-medium mb-2">用户名</label>
                            <input type="text" id="registerUsername" required
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
                                placeholder="请输入用户名">
                        </div>
                        <div>
                            <label class="block text-gray-700 font-medium mb-2">密码</label>
                            <input type="password" id="registerPassword" required
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
                                placeholder="至少6个字符">
                        </div>
                        <div>
                            <label class="block text-gray-700 font-medium mb-2">Minecraft ID</label>
                            <input type="text" id="registerMinecraftId" required
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
                                placeholder="游戏内玩家名">
                            <p class="text-xs text-gray-500 mt-1">你的 Minecraft 游戏角色名称</p>
                        </div>
                        <div id="registerError" class="hidden p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm"></div>
                        <div id="registerSuccess" class="hidden p-3 bg-green-100 border border-green-400 text-green-700 rounded-lg text-sm"></div>
                        <button type="submit"
                            class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white py-3 rounded-lg font-semibold hover:from-purple-600 hover:to-pink-600 transform hover:scale-105 transition duration-200 shadow-lg">
                            注册
                        </button>
                    </form>
                </div>
            </div>

            <!-- Footer -->
            <div class="text-center mt-6 text-white text-sm">
                <p>&copy; 2026 Minecraft Web 管理系统</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
