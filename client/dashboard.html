<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理面板 - Akiyy Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100">
    <!-- Header -->
    <nav class="bg-white shadow-md mb-8">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Akiyy Hub</h1>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-gray-600">欢迎, <span id="username" class="font-semibold"></span></span>
                <span class="text-sm text-gray-500">(<span id="minecraftId"></span>)</span>
                <button id="logoutBtn" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">
                    登出
                </button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4">
        <!-- Player Actions -->
        <div class="grid md:grid-cols-2 gap-6 mb-6">
            <!-- Set Nickname Card -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold mb-4 text-gray-800">设置昵称</h2>
                <form id="nicknameForm" class="space-y-4">
                    <div>
                        <label class="block text-gray-700 mb-2">新昵称</label>
                        <input type="text" id="nicknameInput" required
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="输入你的新昵称">
                    </div>
                    <div id="nicknameMessage" class="hidden p-3 rounded-lg text-sm"></div>
                    <button type="submit"
                        class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition">
                        设置昵称
                    </button>
                </form>
            </div>

            <!-- Set Skin Card -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold mb-4 text-gray-800">设置皮肤</h2>
                <form id="skinForm" class="space-y-4">
                    <div>
                        <label class="block text-gray-700 mb-2">皮肤类型</label>
                        <select id="skinType" 
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                            <option value="mojang">Mojang 官方</option>
                            <option value="elyby">Ely.by</option>
                            <option value="url">自定义 URL</option>
                            <option value="clear">清除皮肤</option>
                        </select>
                    </div>
                    <div id="skinValueDiv">
                        <label class="block text-gray-700 mb-2" id="skinValueLabel">玩家名</label>
                        <input type="text" id="skinValue"
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                            placeholder="输入玩家名或 URL">
                    </div>
                    <div id="skinMessage" class="hidden p-3 rounded-lg text-sm"></div>
                    <button type="submit"
                        class="w-full bg-purple-500 text-white py-2 rounded-lg hover:bg-purple-600 transition">
                        设置皮肤
                    </button>
                </form>
            </div>

            <!-- Upload Skin Card -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold mb-4 text-gray-800">上传皮肤文件</h2>
                <form id="uploadSkinForm" class="space-y-4">
                    <div>
                        <label class="block text-gray-700 mb-2">选择皮肤文件</label>
                        <input type="file" id="skinFile" accept=".png,.jpg,.jpeg"
                            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:bg-green-50 file:text-green-700 hover:file:bg-green-100">
                        <p class="text-xs text-gray-500 mt-1">支持 PNG、JPG、JPEG 格式，最大 3MB</p>
                    </div>
                    <div id="uploadPreview" class="hidden">
                        <label class="block text-gray-700 mb-2">预览</label>
                        <img id="previewImage" class="max-w-xs border rounded-lg" alt="皮肤预览">
                        <p id="fileInfo" class="text-xs text-gray-500 mt-2"></p>
                    </div>
                    <div id="uploadMessage" class="hidden p-3 rounded-lg text-sm"></div>
                    <button type="submit"
                        class="w-full bg-green-500 text-white py-2 rounded-lg hover:bg-green-600 transition disabled:bg-gray-400 disabled:cursor-not-allowed">
                        上传并设置皮肤
                    </button>
                </form>
            </div>
        </div>

        <!-- Server Info (placeholder for future features) -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-semibold mb-4 text-gray-800">服务器信息</h2>
            <p class="text-gray-600">更多功能即将推出...</p>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Dashboard specific logic
        const user = getUser();

        if (!isAuthenticated()) {
            window.location.href = 'index.html';
        }

        // Display user info
        document.getElementById('username').textContent = user.username || '';
        document.getElementById('minecraftId').textContent = user.minecraftId || '';

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            clearAuth();
            showToast('已登出', 'info');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 500);
        });

        // Nickname form
        document.getElementById('nicknameForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nickname = document.getElementById('nicknameInput').value.trim();
            const messageDiv = document.getElementById('nicknameMessage');

            try {
                const data = await setNickname(nickname);
                
                if (data.success) {
                    displayMessage(messageDiv, data.message, true);
                    showToast('昵称设置成功！', 'success');
                    document.getElementById('nicknameInput').value = '';
                } else {
                    displayMessage(messageDiv, data.message, false);
                }
            } catch (error) {
                displayMessage(messageDiv, error.message || '网络错误', false);
            }
        });

        // Skin type change handler
        document.getElementById('skinType').addEventListener('change', (e) => {
            const type = e.target.value;
            const valueDiv = document.getElementById('skinValueDiv');
            const valueLabel = document.getElementById('skinValueLabel');
            const valueInput = document.getElementById('skinValue');

            if (type === 'clear') {
                valueDiv.classList.add('hidden');
            } else {
                valueDiv.classList.remove('hidden');
                if (type === 'url') {
                    valueLabel.textContent = '皮肤 URL';
                    valueInput.placeholder = 'https://example.com/skin.png';
                } else {
                    valueLabel.textContent = '玩家名';
                    valueInput.placeholder = '输入玩家名';
                }
            }
        });

        // Skin form
        document.getElementById('skinForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const type = document.getElementById('skinType').value;
            const value = document.getElementById('skinValue').value.trim();
            const messageDiv = document.getElementById('skinMessage');

            if (type !== 'clear' && !value) {
                displayMessage(messageDiv, '请填写必要信息', false);
                return;
            }

            try {
                const data = await setSkin(type, value);

                if (data.success) {
                    displayMessage(messageDiv, data.message, true);
                    showToast('皮肤设置成功！', 'success');
                    if (type !== 'clear') {
                        document.getElementById('skinValue').value = '';
                    }
                } else {
                    displayMessage(messageDiv, data.message, false);
                }
            } catch (error) {
                displayMessage(messageDiv, error.message || '网络错误', false);
            }
        });

        // File input change handler (preview)
        document.getElementById('skinFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            const previewDiv = document.getElementById('uploadPreview');
            const previewImage = document.getElementById('previewImage');
            const fileInfo = document.getElementById('fileInfo');

            if (file) {
                // Show preview
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImage.src = e.target.result;
                    previewDiv.classList.remove('hidden');
                };
                reader.readAsDataURL(file);

                // Show file info
                const fileSizeMB = (file.size / (1024 * 1024)).toFixed(2);
                fileInfo.textContent = `文件名: ${file.name} | 大小: ${fileSizeMB} MB`;
            } else {
                previewDiv.classList.add('hidden');
            }
        });

        // Upload skin form
        document.getElementById('uploadSkinForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('skinFile');
            const file = fileInput.files[0];
            const messageDiv = document.getElementById('uploadMessage');

            if (!file) {
                displayMessage(messageDiv, '请选择要上传的皮肤文件', false);
                return;
            }

            // Validate file size
            const maxSize = 3 * 1024 * 1024; // 3MB
            if (file.size > maxSize) {
                displayMessage(messageDiv, '文件大小超过限制（最大3MB）', false);
                return;
            }

            // Validate file type
            const allowedTypes = ['image/png', 'image/jpeg', 'image/jpg'];
            if (!allowedTypes.includes(file.type)) {
                displayMessage(messageDiv, '只支持 PNG、JPG、JPEG 格式', false);
                return;
            }

            try {
                displayMessage(messageDiv, '正在上传...', true);
                const data = await uploadSkin(file);

                if (data.success) {
                    displayMessage(messageDiv, `${data.message} (文件: ${data.filename})`, true);
                    showToast('皮肤上传成功！', 'success');
                    // Clear form
                    fileInput.value = '';
                    document.getElementById('uploadPreview').classList.add('hidden');
                } else {
                    displayMessage(messageDiv, data.message, false);
                }
            } catch (error) {
                displayMessage(messageDiv, error.message || '上传失败', false);
            }
        });
    </script>
</body>
</html>
